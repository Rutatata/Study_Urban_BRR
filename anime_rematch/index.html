<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime Rematch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Russo+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- Title -->
<div id="title" class="screen show">
  <div class="logo">
    <div class="logo-top">ANIME</div>
    <div class="logo-main">REMATCH</div>
    <div class="logo-sub">аниме-футбол 5×5 · без фолов · без аутов · мяч отскакивает от стен</div>
  </div>
  <div class="btns">
    <button id="btnPlay" class="big">ИГРАТЬ</button>
    <button id="btnHow">УПРАВЛЕНИЕ</button>
  </div>
  <div id="how" class="panel hidden"></div>
</div>

<!-- Character select -->
<div id="select" class="screen">
  <h2 class="hdr">ВЫБЕРИ ГЕРОЯ</h2>
  <div class="sel-wrap">
    <div id="grid"></div>
    <div id="info" class="panel">
      <canvas id="infoPortrait" width="220" height="220"></canvas>
      <div id="infoName"></div>
      <div id="infoAnime"></div>
      <div id="infoStats"></div>
      <div id="infoSpecial"></div>
      <div class="opt">
        <span>Сложность:</span>
        <label><input type="radio" name="diff" value="easy"> Лёгкая</label>
        <label><input type="radio" name="diff" value="normal" checked> Нормальная</label>
        <label><input type="radio" name="diff" value="hard"> Сложная</label>
      </div>
      <div class="opt">
        <span>Время матча:</span>
        <label><input type="radio" name="len" value="120"> 2 мин</label>
        <label><input type="radio" name="len" value="180" checked> 3 мин</label>
        <label><input type="radio" name="len" value="300"> 5 мин</label>
      </div>
      <button id="btnGo" class="big">В БОЙ!</button>
      <button id="btnBack">НАЗАД</button>
    </div>
  </div>
</div>

<!-- Pause -->
<div id="pause" class="screen dim">
  <h2 class="hdr">ПАУЗА</h2>
  <div class="panel how-copy"></div>
  <div class="btns">
    <button id="btnResume" class="big">ПРОДОЛЖИТЬ</button>
    <button id="btnQuit">В МЕНЮ</button>
  </div>
</div>

<!-- End -->
<div id="end" class="screen dim">
  <h2 class="hdr" id="endTitle"></h2>
  <div id="endScore"></div>
  <div id="endList" class="panel"></div>
  <div class="btns">
    <button id="btnRematch" class="big">РЕВАНШ</button>
    <button id="btnPick">ДРУГОЙ ГЕРОЙ</button>
  </div>
</div>

<template id="howTpl">
  <h3>Управление</h3>
  <table>
    <tr><td>WASD / стрелки</td><td>бег</td></tr>
    <tr><td>Shift</td><td>спринт (тратит выносливость)</td></tr>
    <tr><td>Мышь</td><td>прицел (куда бить и пасовать)</td></tr>
    <tr><td>ЛКМ / J — зажать и отпустить</td><td>удар (дольше держишь — сильнее и выше). Работает и с лёта по летящему мячу</td></tr>
    <tr><td>ПКМ / K</td><td>пас партнёру в сторону прицела</td></tr>
    <tr><td>E / L</td><td>навес (пас верхом)</td></tr>
    <tr><td>Пробел</td><td>подкат без мяча · рывок-финт с мячом</td></tr>
    <tr><td>Q</td><td>СУПЕР-УДАР героя (когда шкала энергии полна)</td></tr>
    <tr><td>C</td><td>позвать пас от партнёра</td></tr>
    <tr><td>Esc / P</td><td>пауза</td></tr>
  </table>
  <p>Ты управляешь одним игроком, как в Rematch. Энергия копится за пасы, отборы и сейвы.</p>
</template>

<script src="js/characters.js"></script>
<script src="js/game.js"></script>
</body>
</html>

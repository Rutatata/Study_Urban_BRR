<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tobe! Anime Volley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Russo+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="title" class="screen show">
  <div class="logo">
    <div class="logo-kanji">飛べ!</div>
    <div class="logo-main">ВОЛЕЙБОЛ!!</div>
    <div class="logo-sub">аниме-волейбол от третьего лица · ты — один игрок Карасуно · путь к национальным</div>
  </div>
  <div class="btns">
    <button id="btnPlay" class="big">ИГРАТЬ</button>
    <button id="btnHow">УПРАВЛЕНИЕ</button>
  </div>
  <div id="how" class="panel hidden"></div>
</div>

<div id="select" class="screen">
  <h2 class="hdr">КАРАСУНО: ВЫБЕРИ ИГРОКА</h2>
  <div class="sel-wrap">
    <div class="opp-wrap">
      <div id="grid"></div>
      <h3>Соперник</h3>
      <div id="opps"></div>
    </div>
    <div id="info" class="panel">
      <canvas id="infoPortrait" width="220" height="220"></canvas>
      <div id="infoName"></div>
      <div id="infoRole"></div>
      <div id="infoStats"></div>
      <div id="infoSpecial"></div>
      <div class="opt">
        <span>Сложность:</span>
        <label><input type="radio" name="diff" value="easy"> Лёгкая</label>
        <label><input type="radio" name="diff" value="normal" checked> Нормальная</label>
        <label><input type="radio" name="diff" value="hard"> Сложная</label>
      </div>
      <div class="opt">
        <span>Партия до:</span>
        <label><input type="radio" name="len" value="11"> 11</label>
        <label><input type="radio" name="len" value="15" checked> 15</label>
        <label><input type="radio" name="len" value="25"> 25</label>
      </div>
      <button id="btnGo" class="big">НА ПЛОЩАДКУ!</button>
      <button id="btnBack">НАЗАД</button>
    </div>
  </div>
</div>

<div id="pause" class="screen dim">
  <h2 class="hdr">ТАЙМ-АУТ</h2>
  <div class="panel how-copy"></div>
  <div class="btns">
    <button id="btnResume" class="big">ПРОДОЛЖИТЬ</button>
    <button id="btnQuit">В МЕНЮ</button>
  </div>
</div>

<div id="end" class="screen dim">
  <h2 class="hdr" id="endTitle"></h2>
  <div id="endScore"></div>
  <div id="endList" class="panel"></div>
  <div class="btns">
    <button id="btnRematch" class="big">РЕВАНШ</button>
    <button id="btnPick">ДРУГОЙ ИГРОК / СОПЕРНИК</button>
  </div>
</div>

<template id="howTpl">
  <h3>Управление</h3>
  <table>
    <tr><td>WASD / стрелки</td><td>бег (W — к сетке)</td></tr>
    <tr><td>Shift</td><td>рывок</td></tr>
    <tr><td>Мышь</td><td>прицел на полу: куда бить / кому пасовать</td></tr>
    <tr><td>ЛКМ / J</td><td>касание мяча: приём, пас, атака в прыжке, переброс. Нажимай, когда мяч рядом</td></tr>
    <tr><td>Пробел / ПКМ</td><td>прыжок: для атаки и для блока у сетки</td></tr>
    <tr><td>E</td><td>нырок за мячом</td></tr>
    <tr><td>C</td><td>«Дай мне!» — позвать пас от связующего</td></tr>
    <tr><td>Q</td><td>зарядить ДОБИВАНИЕ героя (при полной энергии) — следующее касание станет супер-приёмом</td></tr>
    <tr><td>Подача</td><td>зажми ЛКМ (подброс), отпусти — удар; дольше держишь — сильнее</td></tr>
    <tr><td>Esc / P</td><td>тайм-аут</td></tr>
  </table>
  <p>Красный круг на полу — куда упадёт мяч на нашей стороне. Жёлтое кольцо «ПРИЁМ / АТАКА» — твоя зона ответственности.
  Для атаки: нажми C, дождись паса, прыгай (Пробел) и бей (ЛКМ) в высшей точке — будет «ИДЕАЛЬНО!».
  Хината + Кагеяма: прыгни ДО паса — получится «Странная быстрая».</p>
</template>

<script src="js/vb_characters.js"></script>
<script src="js/game.js"></script>
</body>
</html>
